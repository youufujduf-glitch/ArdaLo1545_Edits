<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Code-Man Online Mağaza</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #020711; }
    body { overflow-x: hidden; font-family: Arial, Helvetica, sans-serif; }

    .page {
      position: relative;
      min-height: 100vh;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #020711;
    }

    .hero {
      position: relative;
      width: 100%;
      max-width: 1672px;
      aspect-ratio: 1672 / 941;
      overflow: hidden;
      background-image: url('./434.png');
      background-position: center top;
      background-repeat: no-repeat;
      background-size: cover;
      box-shadow: 0 0 60px rgba(0, 75, 190, .28);
    }

    /* Görseldeki ana bölümlere denk gelen görünmez tıklanabilir alanlar */
    .hotspot {
      position: absolute;
      display: block;
      border-radius: 12px;
      outline: none;
      transition: background .2s ease, box-shadow .2s ease;
    }
    .hotspot:hover,
    .hotspot:focus-visible {
      background: rgba(0, 132, 255, .10);
      box-shadow: inset 0 0 0 2px rgba(0, 145, 255, .55), 0 0 18px rgba(0, 95, 255, .25);
    }

    .home-link { left: 28%; top: 1%; width: 11%; height: 8%; }
    .clothing-link { left: 40%; top: 1%; width: 10%; height: 8%; }
    .hoodie-link { left: 50%; top: 1%; width: 11%; height: 8%; }
    .toy-link { left: 61%; top: 1%; width: 15%; height: 8%; }

    .category-clothing { left: 6%; top: 57%; width: 27%; height: 25%; }
    .category-hoodie { left: 34%; top: 57%; width: 28%; height: 25%; }
    .category-toy { left: 64%; top: 57%; width: 29%; height: 25%; }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 700px) {
      .page { align-items: flex-start; }
      .hero {
        min-height: 100vh;
        aspect-ratio: auto;
        background-size: auto 100vh;
        background-position: center top;
      }
      .hotspot { border-radius: 8px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="hero" aria-label="Code-Man Online Mağaza">
      <a class="hotspot home-link" href="#" aria-label="Ana Sayfa"><span class="sr-only">Ana Sayfa</span></a>
      <a class="hotspot clothing-link" href="#kıyafet" aria-label="Kıyafet"><span class="sr-only">Kıyafet</span></a>
      <a class="hotspot hoodie-link" href="#kapsonlu" aria-label="Kapşonlu"><span class="sr-only">Kapşonlu</span></a>
      <a class="hotspot toy-link" href="#pelus-oyuncak" aria-label="Pelüş Oyuncak"><span class="sr-only">Pelüş Oyuncak</span></a>

      <a class="hotspot category-clothing" id="kıyafet" href="#kıyafet" aria-label="Kıyafet kategorisi"><span class="sr-only">Kıyafet kategorisi</span></a>
      <a class="hotspot category-hoodie" id="kapsonlu" href="#kapsonlu" aria-label="Kapşonlu kategorisi"><span class="sr-only">Kapşonlu kategorisi</span></a>
      <a class="hotspot category-toy" id="pelus-oyuncak" href="#pelus-oyuncak" aria-label="Pelüş Oyuncak kategorisi"><span class="sr-only">Pelüş Oyuncak kategorisi</span></a>
    </section>
  </main>
</body>
</html>
